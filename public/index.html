<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6DBE45" />

    <!-- Primary Meta Tags -->
    <title>Genius Books - Trusted Educational Materials Provider</title>
    <meta
      name="description"
      content="Genius Books: Leading provider of CBSE & matriculation syllabus textbooks. Trusted by educators for high-quality educational materials from K-12. Ignite passion for learning with us."
    />
    <meta
      name="keywords"
      content="Genius Books, textbooks, CBSE books, educational materials, academic resources, school books, Chennai, matriculation syllabus, school supplies"
    />
    <meta name="author" content="Genius Books" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Favicon & Apple Touch -->
    <link rel="apple-touch-icon" href="logo.png" />
    

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Genius Books - Trusted Educational Materials Provider" />
    <meta
      property="og:description"
      content="Offering top-tier textbooks and learning materials for CBSE and matriculation syllabus, fostering academic success across Chennai and Tamil Nadu."
    />
    <meta property="og:image" content="https://www.geniusbooks.in/logo.png" />
    <meta property="og:url" content="https://www.geniusbooks.in" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Genius Books - Trusted Educational Materials Provider"
    />
    <meta
      name="twitter:description"
      content="We offer high-quality educational textbooks and resources for CBSE and matriculation syllabus. Trusted by schools across Chennai and Tamil Nadu."
    />
    <meta name="twitter:image" content="https://www.geniusbooks.in/logo.png" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data for Rich Search Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Genius Books",
        "url": "https://www.geniusbooks.in",
        "alternateName": "GeniusBooks",
        "logo": "https://www.geniusbooks.in/logo.png",
        "description": "Leading provider of high-quality educational textbooks for CBSE and matriculation syllabus, fostering academic excellence in students from kindergarten to 12th grade.",
        "sameAs": [
          "https://www.facebook.com/geniusbooks",
          "https://twitter.com/geniusbooks"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-044-4850-3975",
          "contactType": "Customer Service"
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "SP house, Rangarajalu street, Ayyavoo colony",
          "addressLocality": "Aminjikarai, Chennai",
          "postalCode": "600029",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
